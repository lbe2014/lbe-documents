name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/Lbe.Documents.Tests/Lbe.Documents.Tests.csproj -c Release
      - name: Pack
        run: dotnet pack src/Lbe.Documents/Lbe.Documents.csproj -c Release --no-restore
